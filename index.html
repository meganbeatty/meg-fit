<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Meg's Fit" />
<meta name="theme-color" content="#FF6B6B" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23FF6B6B'/><text x='90' y='125' font-size='96' text-anchor='middle'>🔥</text></svg>" />
<title>Meg's Fit</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --primary: #FF6B6B;
  --primary-dark: #e85555;
  --accent: #FF8E53;
  --grad: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
  --bg: #ffffff;
  --card: #F8FAFC;
  --border: #E2E8F0;
  --text: #1E293B;
  --muted: #64748B;
  --success: #10B981;
  --success-bg: #ECFDF5;
  --warn: #F59E0B;
  --nav-h: 72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; color: var(--text); overscroll-behavior: none; }

#app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }

/* ── PANELS ─────────────────────────────────── */
.tab-panel { display: none; flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); }
.tab-panel.active { display: block; }

/* ── BOTTOM NAV ──────────────────────────────── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; border: none; background: none; cursor: pointer; padding: 8px 0;
  color: var(--muted); transition: color .2s;
}
.nav-btn.active { color: var(--primary); }
.nav-btn svg { width: 24px; height: 24px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .3px; }

/* ── HEADER ──────────────────────────────────── */
.page-header {
  background: var(--grad);
  color: white;
  padding: 20px 20px 24px;
  position: relative;
}
.page-header h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
.page-header .sub { font-size: 14px; opacity: .85; margin-top: 4px; font-weight: 500; }
.page-header .phase-badge {
  display: inline-block; background: rgba(255,255,255,.25);
  border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600;
  margin-top: 10px; letter-spacing: .3px;
}

/* ── CARDS / SECTIONS ────────────────────────── */
.section { margin: 14px 16px 0; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
}
.card-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
  background: #fff;
}
.card-header .icon { font-size: 18px; }
.card-header h2 { font-size: 15px; font-weight: 700; flex: 1; }
.card-header .badge {
  background: var(--grad); color: white; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
}
.card-body { padding: 14px 16px; }

/* ── SUPPS ───────────────────────────────────── */
.supp-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.supp-item:last-child { border-bottom: none; padding-bottom: 0; }
.supp-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--grad); margin-top: 5px; flex-shrink: 0;
}
.supp-name { font-size: 14px; font-weight: 600; color: var(--text); }
.supp-timing { font-size: 12px; color: var(--muted); margin-top: 2px; }
.supp-reta .supp-dot { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
.supp-reta .supp-name { color: #7c3aed; }

/* ── WORKOUT CHECKLIST ───────────────────────── */
.warmup-bar {
  background: linear-gradient(135deg, #FEF3C7, #FDE68A);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
  font-size: 13px; color: #92400E; font-weight: 500;
  display: flex; align-items: flex-start; gap: 8px;
}
.section-divider {
  font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
  letter-spacing: .8px; margin: 14px 0 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.exercise-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  transition: opacity .2s;
}
.exercise-item:last-child { border-bottom: none; }
.exercise-item.checked { opacity: .45; }
.exercise-item.checked .ex-name { text-decoration: line-through; }
.ex-check {
  width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .15s; background: #fff;
}
.ex-check.checked { background: var(--grad); border-color: transparent; }
.ex-check svg { display: none; }
.ex-check.checked svg { display: block; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
.ex-sets { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ex-note { font-size: 11px; color: var(--warn); margin-top: 2px; font-weight: 500; }
.ex-weight {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.ex-weight input {
  width: 58px; height: 36px; border: 1.5px solid var(--border); border-radius: 10px;
  text-align: center; font-size: 15px; font-weight: 600; color: var(--text);
  background: #fff; padding: 0 4px; -webkit-appearance: none;
  appearance: none;
}
.ex-weight input:focus { outline: none; border-color: var(--primary); }
.ex-weight label { font-size: 11px; color: var(--muted); font-weight: 500; }

.hotworx-card, .rest-card {
  border-radius: 14px; padding: 20px 16px; text-align: center; margin-top: 4px;
}
.hotworx-card { background: linear-gradient(135deg, #FFF1F2, #FFE4E6); }
.rest-card { background: linear-gradient(135deg, #F0F9FF, #E0F2FE); }
.day-emoji { font-size: 40px; margin-bottom: 8px; }
.day-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.day-desc { font-size: 14px; color: var(--muted); line-height: 1.5; }

.week-note {
  background: linear-gradient(135deg, #F0FDF4, #DCFCE7);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
  font-size: 13px; color: #166534; font-weight: 500;
}

/* ── PROTEIN TRACKER ─────────────────────────── */
.protein-display {
  text-align: center; padding: 16px 16px 8px;
}
.protein-total { font-size: 44px; font-weight: 800; color: var(--text); line-height: 1; }
.protein-total span { font-size: 22px; font-weight: 500; color: var(--muted); }
.protein-label { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
.progress-bar {
  height: 8px; background: var(--border); border-radius: 99px; margin: 12px 16px 0;
  overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--grad); border-radius: 99px;
  transition: width .4s cubic-bezier(.34,1.56,.64,1);
}
.protein-entries {
  padding: 10px 16px 0; max-height: 110px; overflow-y: auto;
}
.protein-entry {
  display: flex; justify-content: space-between;
  font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border);
  color: var(--text);
}
.protein-entry:last-child { border-bottom: none; }
.protein-entry .ent-time { color: var(--muted); }
.protein-input-area { padding: 12px 16px 4px; }
.protein-preview {
  text-align: center; font-size: 28px; font-weight: 700; color: var(--text);
  min-height: 40px; line-height: 40px; letter-spacing: .5px;
}
.protein-preview.empty { color: var(--border); }
.numpad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px;
}
.numpad-btn {
  height: 52px; border-radius: 14px; border: 1.5px solid var(--border);
  font-size: 20px; font-weight: 600; color: var(--text); background: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .1s; -webkit-user-select: none; user-select: none;
  active-scale: .95;
}
.numpad-btn:active { transform: scale(.93); background: var(--card); }
.numpad-btn.add-btn {
  background: var(--grad); color: white; border-color: transparent; font-size: 15px;
}
.numpad-btn.add-btn:active { opacity: .85; transform: scale(.95); }
.numpad-btn.del-btn { font-size: 18px; }

/* ── NOTES ───────────────────────────────────── */
.notes-textarea {
  width: 100%; border: none; background: transparent; resize: none;
  font-size: 14px; color: var(--text); font-family: inherit; line-height: 1.6;
  min-height: 80px; outline: none;
}
.notes-textarea::placeholder { color: var(--border); }

/* ── LOG TAB ─────────────────────────────────── */
.log-header { background: var(--grad); color: white; padding: 24px 20px 20px; }
.log-header h1 { font-size: 24px; font-weight: 800; }
.log-header p { font-size: 14px; opacity: .8; margin-top: 4px; }
.log-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.log-empty .emoji { font-size: 48px; margin-bottom: 12px; }
.log-group { margin: 14px 16px 0; }
.log-group-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
.log-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 8px;
}
.log-ex-name { font-size: 14px; font-weight: 600; }
.log-ex-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.log-weight-val { font-size: 22px; font-weight: 800; color: var(--primary); }
.log-weight-unit { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ── AI CHAT TAB ─────────────────────────────── */
.ai-header { background: var(--grad); color: white; padding: 20px 20px 16px; display: flex; align-items: center; gap: 12px; }
.ai-header h1 { font-size: 20px; font-weight: 800; flex: 1; }
.ai-settings-btn { background: rgba(255,255,255,.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  padding-bottom: 120px;
}
.msg { display: flex; flex-direction: column; max-width: 85%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }
.msg-bubble {
  padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
.msg.user .msg-bubble { background: var(--grad); color: white; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: var(--card); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.msg-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
.typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bounce .6s infinite alternate; }
.typing-dot:nth-child(2) { animation-delay: .15s; }
.typing-dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { from { transform: translateY(0); opacity: .5; } to { transform: translateY(-6px); opacity: 1; } }

.chat-input-wrap {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 10px 16px calc(var(--nav-h) + var(--safe-bottom) + 4px);
  background: #fff; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-end;
  z-index: 50;
}
.chat-input {
  flex: 1; border: 1.5px solid var(--border); border-radius: 22px;
  padding: 10px 16px; font-size: 15px; font-family: inherit;
  resize: none; max-height: 100px; min-height: 40px; outline: none;
  line-height: 1.4; background: var(--card); color: var(--text);
}
.chat-input:focus { border-color: var(--primary); }
.chat-send {
  width: 40px; height: 40px; border-radius: 50%; background: var(--grad); border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  flex-shrink: 0; transition: opacity .2s;
}
.chat-send:disabled { opacity: .4; }
.chat-send svg { width: 18px; height: 18px; }

/* ── SETTINGS OVERLAY ────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
  display: flex; align-items: flex-end; padding-bottom: var(--safe-bottom);
}
.overlay.hidden { display: none; }
.overlay-sheet {
  background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 32px; width: 100%;
}
.overlay-handle { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
.overlay-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.overlay-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.api-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 12px 16px; font-size: 15px; font-family: monospace; color: var(--text);
  outline: none; background: var(--card); margin-bottom: 16px;
}
.api-input:focus { border-color: var(--primary); }
.btn-primary {
  width: 100%; height: 52px; background: var(--grad); color: white; border: none;
  border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: opacity .2s;
}
.btn-primary:active { opacity: .85; }
.btn-secondary {
  width: 100%; height: 44px; background: transparent; color: var(--muted); border: none;
  font-size: 14px; cursor: pointer; margin-top: 8px;
}

.no-workout { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }

/* ── PROGRAM TAB ─────────────────────────────── */
.program-header { background: var(--grad); color: white; padding: 24px 20px 20px; }
.program-header h1 { font-size: 24px; font-weight: 800; }
.program-header p { font-size: 14px; opacity: .8; margin-top: 4px; }
.prog-week-header {
  font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
  letter-spacing: .8px; padding: 16px 16px 6px;
}
.prog-day-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: white;
}
.prog-day-row[onclick] { cursor: pointer; }
.prog-day-row[onclick]:active { background: var(--card); }
.prog-day-row.past { opacity: .45; }
.prog-day-row.today { background: #FFF8F0; border-left: 3px solid var(--primary); }
.prog-day-row.expanded .prog-chevron { transform: rotate(180deg); }
.prog-day-left { display: flex; flex-direction: column; align-items: center; min-width: 38px; flex-shrink: 0; }
.prog-day-name { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.prog-day-num { font-size: 20px; font-weight: 800; line-height: 1.1; }
.prog-today-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin-top: 3px; }
.prog-day-info { flex: 1; min-width: 0; }
.prog-day-workout-name { font-size: 14px; font-weight: 700; }
.prog-day-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.prog-chevron { width: 16px; height: 16px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
.prog-day-detail { display: none; padding: 8px 16px 14px 68px; border-bottom: 1px solid var(--border); background: var(--card); }
.prog-day-detail.open { display: block; }
.prog-ex-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.prog-ex-row:last-child { border-bottom: none; }
.prog-ex-name { color: var(--text); font-weight: 500; }
.prog-ex-tag { font-size: 10px; font-weight: 700; color: var(--muted); background: var(--border); padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
.prog-ex-sets { color: var(--primary); font-weight: 700; flex-shrink: 0; margin-left: 10px; }
.prog-future-block { margin: 8px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.prog-future-name { font-size: 15px; font-weight: 700; }
.prog-future-dates { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* ── WEEKLY WORKOUT ACCORDION ────────────────── */
.workout-accordion-item { border-bottom: 1px solid var(--border); }
.workout-accordion-item:last-child { border-bottom: none; }
.workout-accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer; background: #fff; user-select: none;
  -webkit-user-select: none;
}
.workout-accordion-header:active { background: var(--card); }
.workout-accordion-name { font-size: 15px; font-weight: 700; }
.workout-accordion-meta { display: flex; align-items: center; gap: 8px; }
.workout-completion {
  font-size: 12px; font-weight: 700; color: var(--primary);
  background: var(--success-bg); padding: 2px 8px; border-radius: 20px;
}
.accordion-chevron { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
.workout-accordion-item.open .accordion-chevron { transform: rotate(180deg); }
.workout-accordion-body { display: none; padding: 4px 16px 16px; }
.workout-accordion-item.open .workout-accordion-body { display: block; }

/* ── PROGRAM LOAD BUTTON + PREVIEW ──────────── */
.program-load-btn {
  display: inline-block; margin-top: 10px;
  background: var(--grad); color: white; border: none;
  padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.program-load-btn:disabled { opacity: .5; cursor: default; }
.program-load-btn:active:not(:disabled) { opacity: .85; }
.program-preview-card {
  display: block; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin: 6px 0; font-size: 13px;
}

/* ── TOAST ───────────────────────────────────── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; padding: 10px 20px; border-radius: 20px;
  font-size: 14px; font-weight: 600; z-index: 300; white-space: nowrap;
  animation: fadeInUp .3s ease, fadeOut .3s ease 1.7s forwards;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes fadeOut { to { opacity: 0; } }

/* ── CHAT DATE SEPARATOR ─────────────────────── */
.chat-date-sep {
  text-align: center; font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .5px;
  margin: 8px 0; position: relative;
}
.chat-date-sep::before, .chat-date-sep::after {
  content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: var(--border);
}
.chat-date-sep::before { left: 0; }
.chat-date-sep::after { right: 0; }

/* ── LOG PROGRESSION ─────────────────────────── */
.log-progression { font-size: 11px; color: var(--primary); margin-top: 2px; font-weight: 600; }

/* ── SETTINGS DATA SECTION ───────────────────── */
.settings-divider { height: 1px; background: var(--border); margin: 20px 0; }
.import-area {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 10px 14px; font-size: 12px; font-family: monospace; color: var(--text);
  outline: none; background: var(--card); margin-bottom: 12px;
  min-height: 72px; resize: vertical;
}
.import-area:focus { border-color: var(--primary); }
</style>
</head>
<body>
<div id="app">

  <!-- TODAY TAB -->
  <div id="tab-today" class="tab-panel active">
    <div id="today-content"></div>
  </div>

  <!-- LOG TAB -->
  <div id="tab-log" class="tab-panel">
    <div id="log-content"></div>
  </div>

  <!-- PROGRAM TAB -->
  <div id="tab-program" class="tab-panel">
    <div id="program-content"></div>
  </div>

  <!-- ASK AI TAB -->
  <div id="tab-ai" class="tab-panel">
    <div class="ai-header">
      <div>
        <h1>Ask AI</h1>
        <div style="font-size:13px;opacity:.8;margin-top:2px">Your personal trainer</div>
      </div>
      <button class="ai-settings-btn" onclick="openSettings()">API Key</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-wrap">
      <textarea id="chat-input" class="chat-input" placeholder="Ask anything about your training…" rows="1" onInput="autoGrow(this)" onKeydown="chatKeydown(event)"></textarea>

// SCHEDULE LOGIC
// ═══════════════════════════════════════════════

const PROGRAM_START = new Date('2026-05-04T12:00:00');
const SPECIAL = {
  '2026-05-01': { type:'LIFT', workout: W.RAMP_IN, showWarmup: true },
  '2026-05-02': { type:'REST', name:'Rest Day', desc:'Full rest · Eat well, hit protein target, sleep', emoji:'💤' },
  '2026-05-03': { type:'REST', name:'Rest Day', desc:'Full rest · Eat well, hit protein target, sleep', emoji:'💤' },
  '2026-06-12': { type:'TAPER', name:'Taper Rest', desc:'Taper rest — no lifting, no HIIT. Arrive at your honeymoon feeling fresh.', emoji:'🤍' },
  '2026-06-13': { type:'TAPER', name:'Taper Rest', desc:'Taper rest — no lifting, no HIIT. Arrive at your honeymoon feeling fresh.', emoji:'🤍' },
};

function weekNum(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.floor((d - PROGRAM_START) / 86400000);
  if (diff < 0) return 0;
  return Math.floor(diff / 7) + 1;
}

function getRetaDose(wk) {
  if (wk <= 2) return '0.5mg';
  if (wk <= 4) return '0.75mg';
  return '1.0mg';
}

function getDayInfo(dateStr) {
  if (SPECIAL[dateStr]) return SPECIAL[dateStr];

  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=Sun
  const wk = weekNum(dateStr);

  if (wk < 1 || wk > 6) return null;

  const isPeak = wk >= 5;
  const isDeload = wk === 4;

  // Sunday: REST
  if (dow === 0) return { type:'REST', name:'Rest Day', desc:'Easy walk optional · Infrared sauna optional · Real recovery', emoji:'💤' };

  // Saturday: REST (Hotworx membership cancelled)
  if (dow === 6) return { type:'REST', name:'Rest Day', desc:'Full rest · Easy walk optional · Infrared sauna optional', emoji:'💤' };

  // Tuesday: REST (all weeks)
  if (dow === 2) return { type:'REST', name:'Rest Day', desc:'Full rest · Easy walk optional · Infrared sauna optional', emoji:'💤' };

  // Lift days: Mon, Wed, Thu, Fri
  let workout, showWarmup = true, weekNote = null;

  if (dow === 1) { // Monday
    workout = isPeak ? W.GH_PEAK : isDeload ? W.GH_DELOAD : W.GH_BASE;
    if (wk === 3) weekNote = 'Week 3 intensification — supersets on lower days, increase load 5-10% vs W1-2';
  } else if (dow === 3) { // Wednesday
    workout = isPeak ? W.SB_PEAK : isDeload ? W.SB_DELOAD : W.SB_BASE;
    if (wk === 3) weekNote = 'Week 3 intensification — supersets on lower days, increase load 5-10%';
  } else if (dow === 4) { // Thursday
    workout = isPeak ? W.QA_PEAK : isDeload ? W.QA_DELOAD : W.QA_BASE;
    if (wk === 3) weekNote = 'Week 3 intensification — supersets on lower days, increase load 5-10%';
  } else if (dow === 5) { // Friday
    workout = isPeak ? W.AC_PEAK : isDeload ? W.AC_DELOAD : W.AC_BASE;
  }

  if (!workout) return null;

  return { type:'LIFT', workout, showWarmup, weekNote, week: wk };
}

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function fmtTime(ts) {
  const d = new Date(ts);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')}${ampm}`;
}

function isLiftDay(dayInfo) {
  return dayInfo && dayInfo.type === 'LIFT';
}
function isMonday(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.getDay() === 1;
}

// LS helpers
function lsGet(k, def = null) { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');
  activeTab = tab;
  if (tab === 'log') renderLog();
  if (tab === 'program') renderProgram();
  if (tab === 'ai') {
    renderChat();
    setTimeout(() => document.getElementById('chat-messages').scrollTo(0, 99999), 50);
  }
}

// TODAY TAB
// ═══════════════════════════════════════════════

function renderToday() {
  const date = todayStr();
  const wk = weekNum(date);
  const el = document.getElementById('today-content');

  // Check for dynamic program (after Phase 1 ends)
  let dynProg = null, dynWk = null;
  if (date > '2026-06-13') {
    const programs = lsGet('loaded_programs', []);
    dynProg = programs.find(p => date >= p.start && date <= p.end) || null;
    if (dynProg) {
      dynWk = Math.floor((new Date(date + 'T12:00:00') - new Date(dynProg.start + 'T12:00:00')) / 86400000 / 7) + 1;
    }
  }

  const phaseLabel = wk >= 1 && wk <= 6
    ? `Week ${wk} · ${wk <= 2 ? 'Re-activation' : wk === 3 ? 'Intensification' : wk === 4 ? 'Deload' : 'Peak Phase'}`
    : (date >= '2026-05-01' && date <= '2026-05-03' ? 'Ramp-In' : '');
  const dynPhase = dynProg ? (dynProg.weekPhases.find(ph => ph.weeks.includes(dynWk)) || null) : null;
  const displayPhase = phaseLabel || (dynPhase ? `Week ${dynWk} · ${dynPhase.label}` : '');

  let html = `
    <div class="page-header">
      <div class="sub">${fmtDate(date)}</div>
      <h1>${dynProg ? dynProg.name : 'This Week'}</h1>
      ${displayPhase ? `<div class="phase-badge">${displayPhase}</div>` : ''}
    </div>
  `;

  if (date < '2026-05-01') {
    html += `<div class="no-workout" style="margin-top:40px">🗓️<br><br>Your program kicks off May 1. Get ready.</div>`;
    el.innerHTML = html;
    return;
  }

  if (date > '2026-06-13' && !dynProg) {
    html += `<div class="no-workout" style="margin-top:40px">🤖<br><br>Program complete. Open the AI tab and ask: <em>"What should my next phase look like?"</em></div>`;
    el.innerHTML = html;
    return;
  }

  // Taper days (Jun 12-13) — show rest card, no workouts
  const dayInfo = getDayInfo(date);
  if (dayInfo && dayInfo.type === 'TAPER') {
    html += `<div class="section"><div class="card"><div class="card-body"><div class="rest-card"><div class="day-emoji">${dayInfo.emoji}</div><div class="day-title">${dayInfo.name}</div><div class="day-desc">${dayInfo.desc}</div></div></div></div></div>`;
    html += renderProteinSection(date);
    el.innerHTML = html;
    attachProteinHandlers(date);
    return;
  }

  let weekId;
  if (dynProg) {
    html += renderDynWeeklyWorkouts(dynProg, dynWk);
    weekId = `dp_${dynProg.start}_w${dynWk}`;
  } else if (wk >= 1 && wk <= 6) {
    html += renderWeeklyWorkouts(wk);
    weekId = `w${wk}`;
  } else {
    // Ramp-in (May 1–3)
    if (dayInfo && dayInfo.type === 'LIFT') {
      html += renderSingleLiftDay(dayInfo.workout, 'ramp');
      weekId = 'ramp';
    } else if (dayInfo) {
      html += `<div class="section"><div class="card"><div class="card-body"><div class="rest-card"><div class="day-emoji">${dayInfo.emoji}</div><div class="day-title">${dayInfo.name}</div><div class="day-desc">${dayInfo.desc}</div></div></div></div></div>`;
      weekId = null;
    }
  }

  html += renderProteinSection(date);
  el.innerHTML = html;
  if (weekId) attachWeeklyWorkoutHandlers(weekId);
  attachProteinHandlers(date);
}

// ── SUPPS ────────────────────────────────────

function renderSupps(date, dayInfo, wk) {
  const isLift = isLiftDay(dayInfo);
  const isMon = isMonday(date);
  const dose = getRetaDose(wk);

  let items = [];

  if (isMon && wk >= 1 && wk <= 6) {
    items.push({ cls: 'supp-reta', name: `Reta ${dose}`, timing: 'Monday injection' });
  }
  if (isLift) {
    items.push({ name: 'Ipa 250mcg', timing: 'morning · 60-90 min before eating' });
  }
  items.push({ name: 'Ipa 250mcg', timing: 'before bed · 2hr fasted minimum' });
  items.push({ name: 'Creatine 5g', timing: 'with food' });

// ── WORKOUT ──────────────────────────────────

function renderWorkoutSection(date, dayInfo) {
  if (!dayInfo) return '';

  let inner = '';

  if (dayInfo.type === 'HOTWORX') {
    inner = `
      <div class="hotworx-card">
        <div class="day-emoji">${dayInfo.emoji}</div>
        <div class="day-title">${dayInfo.name}</div>
        <div class="day-desc">${dayInfo.desc}</div>
      </div>`;
  } else if (dayInfo.type === 'REST' || dayInfo.type === 'TAPER') {
    inner = `
      <div class="rest-card">
        <div class="day-emoji">${dayInfo.emoji}</div>
        <div class="day-title">${dayInfo.name}</div>
        <div class="day-desc">${dayInfo.desc}</div>
      </div>`;
  } else if (dayInfo.type === 'LIFT') {
    const checks = lsGet(`checks_${date}`, []);
    const weights = {}; // loaded per exercise below

    if (dayInfo.showWarmup) {
      inner += `<div class="warmup-bar"><span>🏃‍♀️</span><span>${WARMUP}</span></div>`;
    }
    if (dayInfo.weekNote) {
      inner += `<div class="week-note">⚡ ${dayInfo.weekNote}</div>`;
    }
    if (dayInfo.workout.note) {
      inner += `<div class="week-note">ℹ️ ${dayInfo.workout.note}</div>`;
    }

    const exercises = dayInfo.workout.exercises;
    let mainExes = exercises.filter(e => !e.isAb && !e.isGlute);
    let abExes = exercises.filter(e => e.isAb);
    let gluteExes = exercises.filter(e => e.isGlute);

    function exRow(ex) {
      const checked = checks.includes(ex.id);
      const w = lsGet(`weight_${ex.id}`, {weight:'', updatedAt:''});
      return `
        <div class="exercise-item ${checked ? 'checked' : ''}" data-id="${ex.id}">
          <div class="ex-check ${checked ? 'checked' : ''}" data-check="${ex.id}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="2 7 5.5 10.5 12 3.5"/>
            </svg>
          </div>
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-sets">${ex.sets}</div>
            ${ex.note ? `<div class="ex-note">★ ${ex.note}</div>` : ''}
          </div>
          <div class="ex-weight">
            <input type="number" inputmode="decimal" placeholder="—" value="${w.weight || ''}" data-ex="${ex.id}" class="weight-input" />
            <label>lbs</label>
          </div>
        </div>`;
    }

    inner += mainExes.map(exRow).join('');
    if (abExes.length) {
      inner += `<div class="section-divider">AB CIRCUIT / FINISHER</div>`;
      inner += abExes.map(exRow).join('');
    }
    if (gluteExes.length) {
      inner += `<div class="section-divider">GLUTE FINISHER</div>`;
      inner += gluteExes.map(exRow).join('');
    }
  }

  return `
    <div class="section">
      <div class="card">
        <div class="card-header">
          <span class="icon">${dayInfo.type === 'LIFT' ? '🏋️‍♀️' : dayInfo.type === 'HOTWORX' ? '🔥' : '😴'}</span>
          <h2>Workout</h2>
        </div>
        <div class="card-body">${inner}</div>
      </div>
    </div>
  `;
}

function attachWorkoutHandlers(date, dayInfo) {
  if (!isLiftDay(dayInfo)) return;

  // Checkbox toggles
  document.querySelectorAll('[data-check]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.check;
      const checks = lsGet(`checks_${date}`, []);
      const idx = checks.indexOf(id);
      if (idx === -1) checks.push(id); else checks.splice(idx, 1);
      lsSet(`checks_${date}`, checks);
      const item = btn.closest('.exercise-item');
      const checked = checks.includes(id);
      btn.classList.toggle('checked', checked);
      item.classList.toggle('checked', checked);
    });
  });

  // Weight inputs
  let debounceTimers = {};
  document.querySelectorAll('.weight-input').forEach(input => {
    input.addEventListener('input', () => {
      const id = input.dataset.ex;
      clearTimeout(debounceTimers[id]);
      debounceTimers[id] = setTimeout(() => {
        const val = input.value.trim();
        if (val !== '') {
          lsSet(`weight_${id}`, { weight: val, updatedAt: todayStr() });
        }
      }, 600);
    });
  });
}

// ── EXERCISE OVERRIDES ────────────────────────

function getExerciseOverrides() {
  return lsGet('exercise_overrides', {});
}

function applyOverrides(workout, splitKey) {
  const ov = getExerciseOverrides()[splitKey];
  if (!ov) return workout;
  let exercises = workout.exercises.filter(e => !(ov.remove || []).includes(e.id));
  exercises = [...exercises, ...(ov.add || [])];
  return { ...workout, exercises };
}

function getAllNameMap() {
  const map = {};
  [W.GH_BASE, W.GH_DELOAD, W.GH_PEAK, W.SB_BASE, W.SB_DELOAD, W.SB_PEAK,
   W.QA_BASE, W.QA_DELOAD, W.QA_PEAK, W.AC_BASE, W.AC_DELOAD, W.AC_PEAK, W.RAMP_IN]
    .forEach(w => w.exercises.forEach(e => { map[e.id] = e.name; }));
  lsGet('loaded_programs', []).forEach(prog =>
    Object.values(prog.workouts).forEach(w => w.exercises.forEach(e => { map[e.id] = e.name; }))
  );
  return map;
}

// ── WEEKLY WORKOUTS ───────────────────────────

function getWeekWorkouts(wk) {
  if (wk < 1 || wk > 6) return [];
  const isPeak = wk >= 5;
  const isDeload = wk === 4;
  return [
    { key: 'GH', workout: isPeak ? W.GH_PEAK : isDeload ? W.GH_DELOAD : W.GH_BASE },
    { key: 'SB', workout: isPeak ? W.SB_PEAK : isDeload ? W.SB_DELOAD : W.SB_BASE },
    { key: 'QA', workout: isPeak ? W.QA_PEAK : isDeload ? W.QA_DELOAD : W.QA_BASE },
    { key: 'AC', workout: isPeak ? W.AC_PEAK : isDeload ? W.AC_DELOAD : W.AC_BASE },
  ];
}

function renderExerciseRow(ex, checks, wkey) {
  const checked = checks.includes(ex.id);
  const w = lsGet(`weight_${ex.id}`, {weight:'', updatedAt:''});
  return `
    <div class="exercise-item ${checked ? 'checked' : ''}" data-id="${ex.id}" data-wkey="${wkey}">
      <div class="ex-check ${checked ? 'checked' : ''}" data-check="${ex.id}" data-wkey="${wkey}">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2 7 5.5 10.5 12 3.5"/>
        </svg>
      </div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-sets">${ex.sets}</div>
        ${ex.note ? `<div class="ex-note">★ ${ex.note}</div>` : ''}
      </div>
      <div class="ex-weight">
        <input type="number" inputmode="decimal" placeholder="—" value="${w.weight || ''}" data-ex="${ex.id}" class="weight-input" />
        <label>lbs</label>
      </div>
    </div>`;
}

function renderWorkoutAccordionItem(key, workout, weekId, weekNote) {
  workout = applyOverrides(workout, key);
  const storageKey = `checks_${weekId}_${key}`;
  const checks = lsGet(storageKey, []);
  const total = workout.exercises.length;
  const done = checks.filter(id => workout.exercises.some(e => e.id === id)).length;
  const compId = `completion_${weekId}_${key}`;

  const mainExes = workout.exercises.filter(e => !e.isAb && !e.isGlute);
  const abExes = workout.exercises.filter(e => e.isAb);
  const gluteExes = workout.exercises.filter(e => e.isGlute);

  let bodyHtml = `<div class="warmup-bar"><span>🏃‍♀️</span><span>${WARMUP}</span></div>`;
  if (weekNote) bodyHtml += `<div class="week-note">⚡ ${weekNote}</div>`;
  if (workout.note) bodyHtml += `<div class="week-note">ℹ️ ${workout.note}</div>`;
  bodyHtml += mainExes.map(ex => renderExerciseRow(ex, checks, key)).join('');
  if (abExes.length) {
    bodyHtml += `<div class="section-divider">AB CIRCUIT / FINISHER</div>`;
    bodyHtml += abExes.map(ex => renderExerciseRow(ex, checks, key)).join('');
  }
  if (gluteExes.length) {
    bodyHtml += `<div class="section-divider">GLUTE FINISHER</div>`;
    bodyHtml += gluteExes.map(ex => renderExerciseRow(ex, checks, key)).join('');
  }

  return `
    <div class="workout-accordion-item" data-wkey="${key}" data-weekid="${weekId}">
      <div class="workout-accordion-header">
        <div class="workout-accordion-name">${workout.name}</div>
        <div class="workout-accordion-meta">
          <span class="workout-completion" id="${compId}" ${done === 0 ? 'style="display:none"' : ''}>${done}/${total}</span>
          <svg class="accordion-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="workout-accordion-body">${bodyHtml}</div>
    </div>`;
}

function renderWeeklyWorkouts(wk) {
  const workoutList = getWeekWorkouts(wk);
  if (!workoutList.length) return '';
  const weekNote = wk === 3 ? 'Week 3 intensification — supersets on lower days, increase load 5-10% vs W1-2' : null;
  const weekId = `w${wk}`;
  let inner = workoutList.map(({key, workout}) => renderWorkoutAccordionItem(key, workout, weekId, weekNote)).join('');
  return `<div class="section"><div class="card"><div class="card-header"><span class="icon">🏋️‍♀️</span><h2>This Week's Workouts</h2></div><div class="card-body" style="padding:0">${inner}</div></div></div>`;
}

function renderDynWeeklyWorkouts(prog, weekInProg) {
  const phaseInfo = prog.weekPhases.find(ph => ph.weeks.includes(weekInProg));
  if (!phaseInfo) return '';
  const phase = phaseInfo.phase;
  const weekId = `dp_${prog.start}_w${weekInProg}`;
  const splitOrder = ['1','3','4','5'].map(d => prog.weekSchedule[d]).filter(s => s && s !== 'REST');
  const seen = new Set();
  const uniqueSplits = splitOrder.filter(s => { if (seen.has(s)) return false; seen.add(s); return true; });
  let inner = '';
  uniqueSplits.forEach(splitKey => {
    const workout = prog.workouts[`${splitKey}_${phase}`] || prog.workouts[`${splitKey}_BASE`];
    if (workout) inner += renderWorkoutAccordionItem(splitKey, workout, weekId, null);
  });
  return `<div class="section"><div class="card"><div class="card-header"><span class="icon">🏋️‍♀️</span><h2>This Week's Workouts</h2></div><div class="card-body" style="padding:0">${inner}</div></div></div>`;
}

function renderSingleLiftDay(workout, weekId) {
  const checks = lsGet(`checks_${weekId}_RAMP`, []);
  let bodyHtml = `<div class="warmup-bar"><span>🏃‍♀️</span><span>${WARMUP}</span></div>`;
  if (workout.note) bodyHtml += `<div class="week-note">ℹ️ ${workout.note}</div>`;
  bodyHtml += workout.exercises.map(ex => renderExerciseRow(ex, checks, 'RAMP')).join('');
  return `<div class="section"><div class="card"><div class="card-header"><span class="icon">🏋️‍♀️</span><h2>${workout.name}</h2></div><div class="card-body">${bodyHtml}</div></div></div>`;
}

function attachWeeklyWorkoutHandlers(weekId) {
  // Accordion toggle (one open at a time)
  document.querySelectorAll('.workout-accordion-header').forEach(header => {
    header.addEventListener('click', () => {
      const item = header.closest('.workout-accordion-item');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.workout-accordion-item').forEach(i => i.classList.remove('open'));
      if (!isOpen) item.classList.add('open');
    });
  });

  // Checkbox toggles
  document.querySelectorAll('[data-check]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.check;
      const wkey = btn.dataset.wkey;
      const storageKey = `checks_${weekId}_${wkey}`;
      const checks = lsGet(storageKey, []);
      const idx = checks.indexOf(id);
      if (idx === -1) checks.push(id); else checks.splice(idx, 1);
      lsSet(storageKey, checks);
      const exItem = btn.closest('.exercise-item');
      const checked = checks.includes(id);
      btn.classList.toggle('checked', checked);
      exItem.classList.toggle('checked', checked);
      // Update completion badge
      const accordionItem = document.querySelector(`.workout-accordion-item[data-wkey="${wkey}"]`);
      if (accordionItem) {
        const allBtns = accordionItem.querySelectorAll('[data-check]');
        const total = allBtns.length;
        const done = [...allBtns].filter(b => checks.includes(b.dataset.check)).length;
        const countEl = document.getElementById(`completion_${weekId}_${wkey}`);
        if (countEl) { countEl.textContent = `${done}/${total}`; countEl.style.display = done > 0 ? '' : 'none'; }
      }
    });
  });

  // Weight inputs
  let debounceTimers = {};
  document.querySelectorAll('.weight-input').forEach(input => {
    input.addEventListener('input', () => {
      const id = input.dataset.ex;
      clearTimeout(debounceTimers[id]);
      debounceTimers[id] = setTimeout(() => {
        const val = input.value.trim();
        if (val !== '') {
          lsSet(`weight_${id}`, { weight: val, updatedAt: todayStr() });
          const wk = weekNum(todayStr());
          const hist = lsGet('wt_history', {});
          if (!hist[id]) hist[id] = [];
          const existingIdx = hist[id].findIndex(h => h.wk === wk);
          const entry = { wk, weight: val, date: todayStr() };
          if (existingIdx >= 0) hist[id][existingIdx] = entry; else hist[id].push(entry);
          lsSet('wt_history', hist);
        }
      }, 600);
    });
  });
}

            <button class="numpad-btn" onclick="numTap('5')">5</button>
            <button class="numpad-btn" onclick="numTap('6')">6</button>
            <button class="numpad-btn" onclick="numTap('1')">1</button>
            <button class="numpad-btn" onclick="numTap('2')">2</button>
            <button class="numpad-btn" onclick="numTap('3')">3</button>
            <button class="numpad-btn del-btn" onclick="numTap('del')">⌫</button>
            <button class="numpad-btn" onclick="numTap('0')">0</button>
            <button class="numpad-btn add-btn" onclick="numTap('add')">Add</button>
          </div>
        </div>
      </div>
    </div>
  `;

function attachProteinHandlers(date) {
  // Handled via global numTap function, date captured via closure trick
  window._proteinDate = date;
}

function numTap(val) {
  const date = window._proteinDate || todayStr();
  if (val === 'del') {
    proteinInput = proteinInput.slice(0, -1);
  } else if (val === 'add') {
    const amt = parseInt(proteinInput, 10);
    if (amt > 0) {
      const data = lsGet(`protein_${date}`, { total: 0, entries: [] });
      data.total += amt;
      data.entries.push({ amount: amt, ts: Date.now() });
      lsSet(`protein_${date}`, data);
      proteinInput = '';
      // Update UI without full re-render
      const pct = Math.min(100, Math.round((data.total / 130) * 100));
      const totalEl = document.getElementById('protein-total');
      const barEl = document.getElementById('protein-bar');
      const entriesEl = document.getElementById('protein-entries');
      if (totalEl) totalEl.innerHTML = `${data.total}<span>g / 130g</span>`;
      if (barEl) barEl.style.width = pct + '%';
      if (entriesEl) {
        const entries = [...data.entries].reverse().map(e =>
          `<div class="protein-entry"><span>${e.amount}g</span><span class="ent-time">${fmtTime(e.ts)}</span></div>`
        ).join('');
        entriesEl.innerHTML = entries;
      }
    } else {
      proteinInput = '';
    }
  } else {
    if (proteinInput.length >= 4) return;
    proteinInput += val;
  }
  const preview = document.getElementById('protein-preview');
  if (preview) {
    preview.textContent = proteinInput || '0';
    preview.classList.toggle('empty', !proteinInput);
  }
}

function getAllProgramDays(start, end) {
  const days = [];
  let d = new Date(start + 'T12:00:00');
  const e = new Date(end + 'T12:00:00');
  while (d <= e) {
    days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    d.setDate(d.getDate() + 1);
  }
  return days;
}

  const el = document.getElementById('program-content');
  if (!el) return;
  const today = todayStr();
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let html = `<div class="program-header"><h1>Program</h1><p>May 1 – June 13, 2026</p></div>`;

  let lastWkKey = null;
  const days = getAllProgramDays('2026-05-01', '2026-06-13');

  days.forEach(dateStr => {
    const wk = weekNum(dateStr);
    const dayInfo = getDayInfo(dateStr);
    if (!dayInfo) return;

    // Week section header
    const wkKey = wk <= 0 ? 'ramp' : wk;
    if (wkKey !== lastWkKey) {
      lastWkKey = wkKey;
      const wkLabel = wk <= 0 ? 'Ramp-In'
        : `Week ${wk} · ${wk <= 2 ? 'Re-activation' : wk === 3 ? 'Intensification' : wk === 4 ? 'Deload' : 'Peak Phase'}`;
      html += `<div class="prog-week-header">${wkLabel}</div>`;

      }

function renderLog() {
  const el = document.getElementById('log-content');

  let html = `<div class="log-header"><h1>Weight Log</h1><p>Every lift in your program</p></div>`;

  // Phase 1 split groups — deduplicated across all phase variants
  const phase1Groups = [
    { label: '🍑 Glutes + Hamstrings', variants: [W.GH_BASE, W.GH_DELOAD, W.GH_PEAK] },
    { label: '💪 Shoulders + Back',    variants: [W.SB_BASE, W.SB_DELOAD, W.SB_PEAK] },
    { label: '🦵 Quads + Abs',         variants: [W.QA_BASE, W.QA_DELOAD, W.QA_PEAK] },
    { label: '🔥 Arms + Core',         variants: [W.AC_BASE, W.AC_DELOAD, W.AC_PEAK] },
  ];

  const allKnownIds = new Set();

  phase1Groups.forEach(group => {
    const seen = new Set();
    const exercises = [];
    group.variants.forEach(variant => {
      variant.exercises.forEach(ex => {
        if (!seen.has(ex.id)) { seen.add(ex.id); allKnownIds.add(ex.id); exercises.push(ex); }
      });
    });
    html += renderLogGroup(group.label, exercises, allKnownIds);
  });

  // RAMP_IN-only exercises (not in any main split)
  const rampOnly = W.RAMP_IN.exercises.filter(e => !allKnownIds.has(e.id));
  if (rampOnly.length) {
    rampOnly.forEach(e => allKnownIds.add(e.id));
    html += renderLogGroup('📋 Ramp-In', rampOnly, allKnownIds);
  }

  // Dynamic program exercises grouped by split key
  const dynPrograms = lsGet('loaded_programs', []);
  if (dynPrograms.length) {
    const splitLabels = { GH:'🍑 Glutes + Hamstrings', SB:'💪 Shoulders + Back', QA:'🦵 Quads + Abs', AC:'🔥 Arms + Core' };
    const dynGroups = {};
    dynPrograms.forEach(prog => {
      Object.entries(prog.workouts).forEach(([workoutKey, workout]) => {
        const splitKey = workoutKey.split('_')[0];
        if (!dynGroups[splitKey]) dynGroups[splitKey] = { label: `${splitLabels[splitKey] || splitKey} (${prog.name})`, exercises: [] };
        workout.exercises.forEach(ex => {
          if (!allKnownIds.has(ex.id) && !dynGroups[splitKey].exercises.some(e => e.id === ex.id)) {
            dynGroups[splitKey].exercises.push(ex);
            allKnownIds.add(ex.id);
          }
        });
      });
    });
    Object.values(dynGroups).forEach(g => {
      if (g.exercises.length) html += renderLogGroup(g.label, g.exercises, allKnownIds);
    });
  }

  // Orphaned weights (logged but not in any known program)
  const orphaned = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('weight_')) {
      const id = key.slice(7);
      if (!allKnownIds.has(id)) {
        const data = lsGet(key, {});
        if (data && data.weight) orphaned.push({ id, name: id.replace(/_/g, ' '), weight: data.weight, updatedAt: data.updatedAt });
      }
    }
  }
  if (orphaned.length) html += renderLogGroup('📋 Previous Lifts', orphaned, new Set());

  el.innerHTML = html;
}

function renderLogGroup(label, exercises, knownIds) {
  const wtHistory = lsGet('wt_history', {});
  let html = `<div class="log-group"><div class="log-group-title">${label}</div>`;
  exercises.forEach(ex => {
    const w = lsGet(`weight_${ex.id}`, {});
    const dateLabel = w.updatedAt ? fmtDate(w.updatedAt) : null;
    const hist = (wtHistory[ex.id] || []).slice().sort((a, b) => a.wk - b.wk);
    const progression = hist.length > 1 ? hist.map(h => `W${h.wk}: ${h.weight}`).join(' → ') : null;
    html += `
      <div class="log-item">
        <div style="flex:1;min-width:0">
          <div class="log-ex-name">${ex.name || ex.id.replace(/_/g,' ')}</div>
          ${progression
            ? `<div class="log-progression">${progression}</div>`
            : `<div class="log-ex-date" ${!dateLabel ? 'style="color:var(--border)"' : ''}>${dateLabel || 'not logged yet'}</div>`}
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px">
          ${w.weight
            ? `<div class="log-weight-val">${w.weight}</div><div class="log-weight-unit">lbs</div>`
            : `<div class="log-weight-val" style="color:var(--border)">—</div>`}
        </div>
      </div>`;
  });
  html += '</div>';
  return html;
}

function buildSystemPrompt() {
  const today = todayStr();
  const wk = weekNum(today);
  const nameMap = getAllNameMap();
  let prompt = SYSTEM_PROMPT_BASE;

  // Current week exercise lists with overrides
  if (wk >= 1 && wk <= 6) {
    prompt += `\n\nCURRENT WEEK EXERCISES (Week ${wk}):`;
    getWeekWorkouts(wk).forEach(({key, workout}) => {
      const w = applyOverrides(workout, key);
      prompt += `\n\n${w.name}:`;
      w.exercises.forEach(e => {
        let line = `\n  • ${e.name} — ${e.sets}`;
        if (e.isAb) line += ' [AB]';
        if (e.isGlute) line += ' [GLUTE]';
        if (e.note) line += ` ★ ${e.note}`;
        prompt += line;
      });
    });
  }

  // Logged weights with progression history
  const wtHistory = lsGet('wt_history', {});
  const weightLines = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('weight_')) {
      const id = k.slice(7);
      const data = lsGet(k, {});
      if (data.weight) {
        const name = nameMap[id] || id;
        const hist = (wtHistory[id] || []).slice().sort((a, b) => a.wk - b.wk);
        const progStr = hist.length > 1 ? ' (' + hist.map(h => `W${h.wk}: ${h.weight}`).join(' → ') + ')' : '';
        weightLines.push(`  ${name}: ${data.weight} lbs${progStr}`);
      }
    }
  }
  if (weightLines.length) prompt += '\n\nLOGGED WEIGHTS:\n' + weightLines.join('\n');

  // This week's workout completion
  if (wk >= 1 && wk <= 6) {
    const lines = getWeekWorkouts(wk).map(({key, workout}) => {
      const w = applyOverrides(workout, key);
      const checks = lsGet(`checks_w${wk}_${key}`, []);
      const done = checks.filter(id => w.exercises.some(e => e.id === id)).length;
      return `  ${w.name}: ${done}/${w.exercises.length} done`;
    });
    prompt += `\n\nTHIS WEEK'S PROGRESS:\n` + lines.join('\n');
  }

  // Today's protein
  const protein = lsGet(`protein_${today}`, { total: 0 });
  prompt += `\n\nTODAY'S PROTEIN: ${protein.total}g / 130g target`;

  return prompt;
}

function getChatHistory() {
  return lsGet('chat_history', []);
}
function saveChatHistory(msgs) {
  lsSet('chat_history', msgs.slice(-200));
}

function formatChatContent(content) {
  let result = '';
  let lastIndex = 0;
  const re = /```(program-json|program-patch)\n([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(content)) !== null) {
    result += escHtml(content.slice(lastIndex, m.index));
    try {
      const p = JSON.parse(m[2]);
      if (m[1] === 'program-json') {
        result += `<span class="program-preview-card"><strong>${escHtml(p.name || 'New Program')}</strong><br><span style="font-size:12px;color:var(--muted)">${escHtml(p.start)} → ${escHtml(p.end)}</span></span>`;
      } else {
        const n = (p.changes || []).length;
        result += `<span class="program-preview-card">✏️ <strong>${escHtml(p.description || 'Exercise change')}</strong><br><span style="font-size:12px;color:var(--muted)">${n} change${n !== 1 ? 's' : ''}</span></span>`;
      }
    } catch(e) { result += escHtml(m[0]); }
    lastIndex = m.index + m[0].length;
  }
  result += escHtml(content.slice(lastIndex));
  return result;
}

function renderChat() {
  const msgs = getChatHistory();
  const el = document.getElementById('chat-messages');
  if (!el) return;

  if (!msgs.length) {
    el.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6">
      Ask anything about your training, nutrition, peptides, or recovery.<br><br>
      <span style="font-size:28px">💪</span>
    </div>`;
    return;
  }

  const loadedPrograms = lsGet('loaded_programs', []);
  const appliedPatches = lsGet('applied_patches', []);
  let lastDateStr = null;

  el.innerHTML = msgs.map((m, idx) => {
    // Date separator
    const msgDate = m.ts ? new Date(m.ts) : null;
    const msgDateStr = msgDate ? msgDate.toDateString() : null;
    let dateSep = '';
    if (msgDateStr && msgDateStr !== lastDateStr) {
      lastDateStr = msgDateStr;
      const isToday = msgDateStr === new Date().toDateString();
      const label = isToday ? 'Today' : fmtDate(new Date(m.ts).toISOString().slice(0, 10));
      dateSep = `<div class="chat-date-sep">${label}</div>`;
    }

    let extra = '';
    if (m.role === 'assistant') {
      const progMatch = m.content.match(/```program-json\n([\s\S]*?)```/);
      if (progMatch) {
        try {
          const parsed = JSON.parse(progMatch[1]);
          if (parsed.version === 1 && parsed.name && parsed.start) {
            const alreadyLoaded = loadedPrograms.some(p => p.start === parsed.start && p.name === parsed.name);
            extra = `<button class="program-load-btn" ${alreadyLoaded ? 'disabled' : ''} onclick="loadProgram(${idx}, this)">${alreadyLoaded ? '✓ Loaded' : `Load "${escHtml(parsed.name)}" →`}</button>`;
          }
        } catch(e) {}
      }
      const patchMatch = m.content.match(/```program-patch\n([\s\S]*?)```/);
      if (patchMatch) {
        try {
          const parsed = JSON.parse(patchMatch[1]);
          const patchKey = `patch_${parsed.description}`;
          const alreadyApplied = appliedPatches.includes(patchKey);
          extra = `<button class="program-load-btn" ${alreadyApplied ? 'disabled' : ''} onclick="applyProgramPatch(${idx}, this)">${alreadyApplied ? '✓ Applied' : 'Apply this change →'}</button>`;
        } catch(e) {}
      }
    }
    return `${dateSep}<div class="msg ${m.role}"><div class="msg-bubble">${formatChatContent(m.content)}</div>${extra}${m.ts ? `<div class="msg-time">${fmtTime(m.ts)}</div>` : ''}</div>`;
  }).join('');
}

function loadProgram(msgIdx, btn) {
  const msgs = getChatHistory();
  const msg = msgs[msgIdx];
  if (!msg) return;
  const progMatch = msg.content.match(/```program-json\n([\s\S]*?)```/);
  if (!progMatch) return;
  try {
    const parsed = JSON.parse(progMatch[1]);
    const programs = lsGet('loaded_programs', []);
    if (!programs.some(p => p.start === parsed.start && p.name === parsed.name)) {
      programs.push(parsed);
      lsSet('loaded_programs', programs);
    }
    btn.disabled = true;
    btn.textContent = '✓ Loaded';
    showToast(`"${parsed.name}" loaded ✓`);
  } catch(e) {
    showToast('Error loading program');
  }
}

function applyProgramPatch(msgIdx, btn) {
  const msgs = getChatHistory();
  const msg = msgs[msgIdx];
  if (!msg) return;
  const patchMatch = msg.content.match(/```program-patch\n([\s\S]*?)```/);
  if (!patchMatch) return;
  try {
    const patch = JSON.parse(patchMatch[1]);
    const overrides = lsGet('exercise_overrides', {});
    (patch.changes || []).forEach(change => {
      const split = change.split;
      if (!overrides[split]) overrides[split] = { remove: [], add: [] };
      if ((change.type === 'swap' || change.type === 'remove') && change.remove_id) {
        if (!overrides[split].remove.includes(change.remove_id)) overrides[split].remove.push(change.remove_id);
      }
      if ((change.type === 'swap' || change.type === 'add') && change.add) {
        overrides[split].add = overrides[split].add.filter(e => e.id !== change.add.id);
        overrides[split].add.push(change.add);
      }
    });
    lsSet('exercise_overrides', overrides);
    const patchKey = `patch_${patch.description}`;
    const applied = lsGet('applied_patches', []);
    if (!applied.includes(patchKey)) { applied.push(patchKey); lsSet('applied_patches', applied); }
    btn.disabled = true;
    btn.textContent = '✓ Applied';
    showToast('Change applied ✓');
    if (document.getElementById('tab-today').classList.contains('active')) renderToday();
  } catch(e) {
    showToast('Error applying change');
  }
}

function exportData() {
  const data = { _exported: new Date().toISOString(), _version: 2 };
  const always = ['exercise_overrides', 'loaded_programs', 'applied_patches', 'chat_history', 'wt_history', 'anthropic_api_key'];
  always.forEach(k => { const v = lsGet(k, null); if (v !== null) data[k] = v; });
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.startsWith('weight_') || k.startsWith('protein_') || k.startsWith('checks_'))) {
      data[k] = lsGet(k, null);
    }
  }
  const json = JSON.stringify(data, null, 2);
  const file = new File([json], 'meg-fit-backup.json', { type: 'application/json' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Meg Fit Backup' }).catch(() => fallbackCopy(json));
  } else {
    fallbackCopy(json);
  }
}

function fallbackCopy(text) {
  navigator.clipboard?.writeText(text).then(() => showToast('Copied to clipboard ✓')).catch(() => showToast('Could not copy'));
}

function importData() {
  const text = document.getElementById('import-area')?.value.trim();
  if (!text) { showToast('Paste your backup JSON first'); return; }
  try {
    const data = JSON.parse(text);
    const { _exported, _version, ...entries } = data;
    Object.entries(entries).forEach(([k, v]) => lsSet(k, v));
    showToast('Data restored ✓');
    closeSettings();
    renderToday();
  } catch(e) {
    showToast('Invalid backup — check the JSON');
  }
}

function showToast(message) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2200);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  const sendBtn = document.getElementById('chat-send-btn');
  if (sendBtn) sendBtn.disabled = !el.value.trim();
}

function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = lsGet('anthropic_api_key', null);
  if (!apiKey) {
    openSettings();
    return;
  }

  const msgs = getChatHistory();
  msgs.push({ role: 'user', content: text, ts: Date.now() });
  saveChatHistory(msgs);

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('chat-send-btn').disabled = true;

  renderChat();
  const chatEl = document.getElementById('chat-messages');

  // Show typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'msg assistant';
  typingEl.id = 'typing';
  typingEl.innerHTML = `<div class="msg-bubble" style="padding:8px 14px">
    <div class="typing-indicator">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>
  </div>`;
  chatEl.appendChild(typingEl);
  chatEl.scrollTo(0, chatEl.scrollHeight);

  try {
    const apiMsgs = msgs.slice(-30).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        system: buildSystemPrompt(),
        messages: apiMsgs,
      }),
    });

    const data = await res.json();
    typingEl.remove();

    if (data.error) throw new Error(data.error.message);

    const reply = data.content[0].text;
    msgs.push({ role: 'assistant', content: reply, ts: Date.now() });
    saveChatHistory(msgs);
    renderChat();
    chatEl.scrollTo(0, chatEl.scrollHeight);
  } catch (err) {
    typingEl.remove();
    const errEl = document.createElement('div');
    errEl.className = 'msg assistant';
    errEl.innerHTML = `<div class="msg-bubble" style="color:#ef4444">Error: ${escHtml(err.message)}</div>`;
    chatEl.appendChild(errEl);
    chatEl.scrollTo(0, chatEl.scrollHeight);
  }
}

function openSettings() {

  if (saved) input.value = saved;
  overlay.classList.remove('hidden');
  setTimeout(() => input.focus(), 100);
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.add('hidden');
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (val) {
    lsSet('anthropic_api_key', val);
    closeSettings();
  }
}

document.getElementById('settings-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('settings-overlay')) closeSettings();
});

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

renderToday();

// Show API key prompt on first visit to AI tab
document.getElementById('nav-ai').addEventListener('click', () => {
  if (!lsGet('anthropic_api_key', null)) {
    setTimeout(() => openSettings(), 200);
  }
});
